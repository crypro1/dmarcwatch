[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmarcwatch"
version = "0.1.0"
description = "Lokaler DMARC-Monitor für macOS: IMAP-Abruf, Auswertung, Menüleiste. Keine Cloud."
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "defusedxml==0.7.1",
    "keyring==25.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
dmarcwatch = "dmarcwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
